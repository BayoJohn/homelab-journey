expose:
  type: ingress

  tls:
    enabled: false

  ingress:
    className: nginx
    hosts:
      core: harbor.local
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"

externalURL: http://harbor.local:31518

harborAdminPassword: "Harbor12345"

persistence:
  enabled: true
  resourcePolicy: keep

  persistentVolumeClaim:
    registry:
      storageClass: longhorn-one-replica
      size: 2Gi

    jobservice:
      jobLog:
        storageClass: longhorn-one-replica
        size: 256Mi

    database:
      storageClass: longhorn-one-replica
      size: 1Gi

    redis:
      storageClass: longhorn-one-replica
      size: 256Mi

trivy:
  enabled: false

database:
  type: internal

redis:
  type: internal
